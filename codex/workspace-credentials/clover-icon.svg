cat > "$WORK/clover-credentials.json" <<EOF
{
  "client_id": $(json "$CLOVER_CLIENT_ID"),
  "client_secret": $(json "$CLOVER_CLIENT_SECRET"),
  "server_url": $(json "$CLOVER_SERVER_URL"),
  "auth_url": $(json "$CLOVER_AUTH_URL")
}
EOF

mkdir -p "$(dirname "$CLOVER_OUT")"
rm -f "$CLOVER_OUT"
# -D: no directory entries, so the archive holds only regular files
(cd "$WORK" && zip -qrXD "$CLOVER_OUT" .)
chmod 600 "$CLOVER_OUT"

echo
echo "Built $CLOVER_OUT"
echo "  plugin:  clover-credentials $CLOVER_PLUGIN_VERSION"
echo "  client:  ${CLOVER_CLIENT_ID:0:4}… (secret not shown)"
echo "  server:  $CLOVER_SERVER_URL"
echo
echo "Upload: admin.openai.com -> Marketplaces -> Add -> Upload plugin,"
echo "then Plugins -> open 'Clover Kura connection' -> Installed."
echo "The zip contains the secret in plain text: delete it after uploading."
